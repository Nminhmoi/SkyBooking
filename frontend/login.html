<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập - SkyBook</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">

<div class="auth-card">
  <div class="mb-4 text-primary" style="font-size: 3rem;">
    <i class="fa-solid fa-plane-departure"></i>
  </div>
  
  <h3>Đăng nhập</h3>
  
  <form id="loginForm">
    <div class="form-floating mb-3">
      <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
      <label for="email">Địa chỉ Email</label>
    </div>
    
    <div class="form-floating mb-3">
      <input type="password" class="form-control" id="password" placeholder="Mật khẩu" required>
      <label for="password">Mật khẩu</label>
    </div>

    <button type="submit" class="btn btn-primary w-100">Đăng nhập ngay</button>
  </form>
  
  <p class="mt-4">Chưa có tài khoản? <a href="register.html">Đăng ký tại đây</a></p>
  <div class="mt-2">
      <a href="index.html" class="text-secondary small"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/app.js"></script>
<script>
// (Giữ nguyên phần script xử lý login cũ của bạn)
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  // Hiển thị loading nhẹ
  const submitBtn = document.querySelector("button[type='submit']");
  const originalText = submitBtn.innerText;
  submitBtn.innerText = "Đang xử lý...";
  submitBtn.disabled = true;

  try {
    const res = await fetch('https://skybooking.onrender.com/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.success) { 
      localStorage.setItem("token", data.token);
      localStorage.setItem("loggedInUser", JSON.stringify(data.data)); 

      Swal.fire({
        icon: 'success',
        title: 'Thành công!',
        text: 'Đang chuyển hướng...',
        timer: 1500,
        showConfirmButton: false
      }).then(() => {
        window.location.href = "index.html";
      });
    } else {
      Swal.fire({
        icon: 'error',
        title: 'Lỗi',
        text: data.message || 'Email hoặc mật khẩu không đúng!'
      });
    }
  } catch (err) {
    console.error(err);
    Swal.fire({ icon: 'error', title: 'Lỗi', text: "Không thể kết nối Server!" });
  } finally {
    submitBtn.innerText = originalText;
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
